<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8" />
        <title>Task 0</title>
        <script src="https://code.jquery.com/jquery-4.0.0.slim.min.js" integrity="sha256-8DGpv13HIm+5iDNWw1XqxgFB4mj+yOKFNb+tHBZOowc=" crossorigin="anonymous"></script>
        <script type="application/javascript">
            function createFamilyTree() {
                // Creation of the table header
                let $header = $("<thead>")
                    .append($("<tr>")
                        .append($("<th>").text("Firstname"))
                        .append($("<th>").text("Lastname"))
                    );

                // Creation of the table body
                let $body = $("<tbody>");

                // Creation of the full table
                let $table = $("<table>")
                    .append($header)
                    .append($body);

                $("body").append($table);
            }

            function addNewMember(firstName, lastName, position) {
                let $body = $("tbody");

                // Removal behavior
                let $button = $("<td>")
                    .text("(x)")
                    .css("background-color", "orange")
                    .on("click", function() {
                        $(this).parent().remove();
                    });

                // Row construction
                let $content = $("<tr>")
                    .append($("<td>").text(firstName))
                    .append($("<td>").text(lastName))
                    .append($button);

                if (position === "before") {
                    $body.prepend($content);
                } else {
                    $body.append($content);
                }
            }

            function createForm() {
                let $table = $("table");

                let $select = $("<select>");
                let $optionA = $("<option>Before</option>").attr({value: "before"});
                let $optionB = $("<option>After</option>").attr({value: "after"});
                let $submit = $("<input>").attr({type: "submit"});
                
                $submit.on("click", function() {
                    const firstName = $("input").first().val();
                    const lastName = $("input:nth-child(3)").val();
                    const position = $("select").val();

                    // alert(`${firstName}, ${lastName}, ${position}`);

                    addNewMember(firstName, lastName, position);
                });

                $select.append($optionA);
                $select.append($optionB);

                $table.before($("<input>").attr({type: "text"}));
                $table.before($("<input>").attr({type: "text"}));

                $table.before($select);
                $table.before($submit);
            }

            $(document).ready( function() {
                createFamilyTree();
                createForm();

                console.log($("body").children());
            });
        </script>
    </head>

    <body>
    </body>
</html>
