<!DOCTYPE html>
<html lang="en" dir="ltr">

        <script src="https://code.jquery.com/jquery-4.0.0.slim.min.js" integrity="sha256-8DGpv13HIm+5iDNWw1XqxgFB4mj+yOKFNb+tHBZOowc=" crossorigin="anonymous"></script>
        <script type="application/javascript">
            function createFamilyTree() {
                // Original table content defined in different variables for clarity
                let header = "<thead><tr><th>Firstname</th><th>Lastname</th></tr></thead>";

                let rowA = "<tr><td>Guillaume</td><td>Salva</td></tr>";
                let rowB = "<tr><td>Paulette</td><td>Salva</td></tr>";
                let rowC = "<tr><td>Antoine</td><td>Salva</td></tr>";

                let body = `<tbody>${rowA}${rowB}${rowC}</tbody>`

                // jQuery object creation from a single template string
                let $table = $(`<table>${header}${body}</table>`);

                $("body").append($table);
            }

            $(document).ready( createFamilyTree );
        </script>
    </head>
